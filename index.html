<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>TenTwenty Farms — Banner Slider</title>
    <meta
      name="description"
      content="TenTwenty Farms hero banner slider — from our farms to your hands."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "Work Sans",
                "ui-sans-serif",
                "system-ui",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/slider.css" />
    <link rel="stylesheet" href="./css/text-reveal.css" />
  </head>
  <body class="bg-neutral-900 font-sans antialiased text-white">
    <p class="absolute right-4 top-4 z-50 text-sm">
      <a href="./quality-slider.html" class="text-white/80 underline-offset-4 hover:text-white hover:underline"
        >Quality Products →</a
      >
    </p>
    <section
      id="banner-slider"
      class="banner relative h-[100svh] min-h-[100dvh] w-full overflow-x-hidden overflow-y-hidden outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-white/70"
      aria-roledescription="carousel"
      aria-label="TenTwenty Farms banner"
      tabindex="0"
    >
      <div
        id="banner-slides"
        class="banner__slides absolute inset-0"
        data-slides
        aria-live="off"
      ></div>

      <div
        class="pointer-events-none absolute inset-x-0 z-10 px-5 md:px-12 lg:px-16 top-[18vh] md:top-1/2 md:-translate-y-1/2"
      >
        <div class="banner__copy max-w-[15.5rem] sm:max-w-xs md:max-w-md lg:max-w-xl" data-copy>
          <p
            class="banner__eyebrow text-sm font-normal tracking-wide text-white md:text-base"
          >
            Welcome To TenTwenty Farms
          </p>
          <h1
            class="banner__title mt-3 text-[2rem] font-semibold leading-[1.15] text-white sm:text-4xl md:mt-4 md:text-5xl lg:text-[3.5rem] lg:leading-[1.12]"
          >
            From Our Farms To Your Hands
          </h1>
        </div>
      </div>

      <div
        class="banner__controls absolute inset-x-0 bottom-0 z-10 flex items-center gap-5 px-5 md:gap-8 md:px-12 lg:gap-10 lg:px-16"
        data-controls
      >
        <button
          type="button"
          class="banner__next group relative shrink-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-black/40"
          data-next
          aria-label="Next slide"
          aria-controls="banner-slides"
        >
          <span class="banner__next-frame relative block overflow-hidden">
            <span class="banner__next-thumbs absolute inset-0" aria-hidden="true">
              <img
                class="banner__next-thumb is-shown"
                data-next-thumb-a
                src="./assets/slides/02.jpg"
                alt=""
                width="160"
                height="160"
                decoding="async"
              />
              <img
                class="banner__next-thumb"
                data-next-thumb-b
                src="./assets/slides/03.jpg"
                alt=""
                width="160"
                height="160"
                decoding="async"
              />
            </span>
            <span
              class="pointer-events-none absolute inset-0 z-[1] flex items-center justify-center text-xs font-medium uppercase tracking-[0.2em] text-white md:text-sm"
              aria-hidden="true"
            >
              Next
            </span>
            <svg
              class="banner__next-svg pointer-events-none absolute inset-0 z-[2] h-full w-full overflow-visible"
              viewBox="0 0 100 100"
              fill="none"
              aria-hidden="true"
              preserveAspectRatio="none"
            >
              <rect
                class="banner__next-track"
                x="2.5"
                y="2.5"
                width="95"
                height="95"
                stroke="rgba(255,255,255,0.35)"
                stroke-width="1"
              />
              <rect
                class="banner__next-progress"
                data-next-progress
                x="2.5"
                y="2.5"
                width="95"
                height="95"
                stroke="#fff"
                stroke-width="4"
                stroke-linecap="square"
                pathLength="100"
                stroke-dasharray="100"
                stroke-dashoffset="100"
              />
            </svg>
          </span>
        </button>

        <div
          class="banner__counter flex min-w-0 flex-1 items-center gap-3 text-sm font-medium tracking-wide text-white md:gap-4 md:text-base"
          aria-live="polite"
          aria-atomic="true"
        >
          <span class="sr-only" data-status>Slide 1 of 4</span>
          <span
            class="banner__counter-current relative inline-flex h-[1.25em] w-[1.6em] overflow-hidden tabular-nums"
            data-counter-window
          >
            <span class="banner__counter-num" data-current>01</span>
          </span>
          <span
            class="banner__bar relative h-px max-w-[7rem] flex-1 bg-white/35 md:max-w-[10rem]"
            aria-hidden="true"
          >
            <span
              class="banner__bar-fill absolute inset-y-0 left-0 bg-white"
              data-bar-fill
              style="width: 0%"
            ></span>
          </span>
          <span class="tabular-nums" data-total>04</span>
        </div>
      </div>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"
      defer
    ></script>
    <script src="./js/text-reveal.js" defer></script>
    <script src="./js/slider.js" defer></script>
  </body>
</html>
